name: Install Fujiyama Joe-style batches

on:
  push:
    branches: [art/fujiyama-joe-style-batches]
    paths: [dev_art/fujiyama/upload/READY]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified source package
        shell: bash
        run: |
          set -euo pipefail
          test -f dev_art/fujiyama/upload/READY
          cat dev_art/fujiyama/upload/chunk_*.txt > /tmp/fujiyama.b64
          base64 --decode /tmp/fujiyama.b64 > /tmp/fujiyama.zip
          echo "713c61495e828bdfb2fe943361980cc049faddec64cbdd3c6f650370e9e131a7  /tmp/fujiyama.zip" | sha256sum -c -
          unzip -o /tmp/fujiyama.zip -d .

      - name: Install image tooling
        run: python3 -m pip install --quiet pillow numpy scipy

      - name: Generate and validate 73 production frames
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import numpy as np
          import scipy.ndimage as ndi
          import json, hashlib, math, re

          root = Path('.')
          source_root = root / 'dev_art/fujiyama/generated_batches'
          manifest = json.loads((source_root / 'install_manifest.json').read_text())
          sprite_root = root / 'assets/characters/fujiyama/sprites'
          canvas_w, canvas_h = map(int, manifest['canvas'])
          baseline = int(manifest['baseline_y'])
          alpha_threshold = int(manifest['alpha_threshold'])
          atlases = {int(k): Image.open(source_root / v['file']).convert('RGBA') for k, v in manifest['groups'].items()}
          scales = {int(k): float(v['uniform_scale']) for k, v in manifest['groups'].items()}
          expected = {
              'idle':4, 'walk':6, 'punch':5, 'kick':6,
              'crouch':3, 'crouch_punch':5, 'crouch_kick':6,
              'block':3, 'crouch_block':3, 'jump':5, 'hurt':3,
              'special_1':8, 'special_2':8, 'ko':8,
          }
          assert sum(expected.values()) == 73

          def isolate_largest(crop):
              arr = np.array(crop.convert('RGBA'))
              labels, count = ndi.label(arr[:, :, 3] > alpha_threshold)
              if count == 0:
                  raise ValueError('source crop has no visible component')
              sizes = ndi.sum(labels > 0, labels, range(1, count + 1))
              keep = int(np.argmax(sizes)) + 1
              arr[labels != keep, 3] = 0
              image = Image.fromarray(arr, 'RGBA')
              bbox = image.getchannel('A').getbbox()
              if bbox is None:
                  raise ValueError('isolated source component is empty')
              return image.crop(bbox)

          qa = {'frame_count':0, 'minimum_clearance_px':9999, 'frames':[]}
          rendered = {}
          for animation, count in expected.items():
              specs = manifest['animations'].get(animation, [])
              if len(specs) != count:
                  raise ValueError(f'{animation}: expected {count}, got {len(specs)}')
              out_dir = sprite_root / animation
              out_dir.mkdir(parents=True, exist_ok=True)
              rendered[animation] = []
              for number, spec in enumerate(specs, 1):
                  atlas_id = int(spec['atlas'])
                  x, y, w, h = map(int, spec['bbox'])
                  subject = isolate_largest(atlases[atlas_id].crop((x, y, x + w, y + h)))
                  scale = scales[atlas_id]
                  tw, th = max(1, round(subject.width * scale)), max(1, round(subject.height * scale))
                  subject = subject.resize((tw, th), Image.Resampling.LANCZOS)
                  px, py = round((canvas_w - tw) / 2), baseline - th
                  if px < 0 or py < 0 or px + tw > canvas_w or py + th > canvas_h:
                      raise ValueError(f'{animation}_{number:03d}: artwork clips canvas')
                  canvas = Image.new('RGBA', (canvas_w, canvas_h), (0,0,0,0))
                  canvas.alpha_composite(subject, (px, py))
                  path = out_dir / f'{animation}_{number:03d}.png'
                  canvas.save(path, optimize=True)
                  alpha = np.array(canvas.getchannel('A'))
                  ys, xs = np.where(alpha > 0)
                  if len(xs) == 0:
                      raise ValueError(f'{path}: empty')
                  bbox = [int(xs.min()), int(ys.min()), int(xs.max()), int(ys.max())]
                  clearance = [bbox[0], bbox[1], canvas_w-1-bbox[2], canvas_h-1-bbox[3]]
                  if min(clearance) <= 0:
                      raise ValueError(f'{path}: edge clipping {clearance}')
                  qa['minimum_clearance_px'] = min(qa['minimum_clearance_px'], min(clearance))
                  qa['frame_count'] += 1
                  qa['frames'].append({'file':path.as_posix(), 'atlas':atlas_id, 'component':int(spec['component']), 'uniform_scale':scale, 'bbox':bbox, 'clearance':clearance, 'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
                  rendered[animation].append(path)

          if qa['frame_count'] != 73:
              raise ValueError(f'expected 73 frames, got {qa["frame_count"]}')

          # Compact contact sheet committed with the generated batch for final visual review.
          cols, cell, label_h = 8, 128, 20
          rows = sum(math.ceil(expected[a] / cols) for a in expected)
          sheet = Image.new('RGB', (cols*cell, rows*(cell+label_h)), (35,37,42))
          draw = ImageDraw.Draw(sheet)
          row = 0
          for animation in expected:
              for i, path in enumerate(rendered[animation]):
                  image = Image.open(path).convert('RGBA')
                  image.thumbnail((118,118), Image.Resampling.LANCZOS)
                  x = (i % cols)*cell + (cell-image.width)//2
                  y = (row + i//cols)*(cell+label_h) + label_h + (cell-image.height)//2
                  sheet.paste(image.convert('RGB'), (x,y))
                  draw.text(((i%cols)*cell+4, (row+i//cols)*(cell+label_h)+3), f'{animation} {i+1}', fill='white')
              row += math.ceil(len(rendered[animation])/cols)
          sheet.save(source_root / 'fujiyama_73_contact.jpg', quality=90)
          (source_root / 'qa_report.json').write_text(json.dumps(qa, indent=2) + '\n')

          fighter = root / 'data/fighters/fujiyama.tres'
          text = fighter.read_text()
          text, n = re.subn(r'(?m)^visual_scale\s*=\s*[-+0-9.]+\s*$', f'visual_scale = {float(manifest["visual_scale"]):g}', text, count=1)
          if n != 1:
              raise ValueError('could not update Fujiyama visual_scale')
          fighter.write_text(text)
          print(f'PASS: 73/73 frames, minimum clearance {qa["minimum_clearance_px"]} px')
          PY

      - name: Remove transfer envelope and commit character
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dev_art/fujiyama/upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete Fujiyama Joe-style sprite batches"
          git push origin HEAD:art/fujiyama-joe-style-batches
