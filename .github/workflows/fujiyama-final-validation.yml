name: Fujiyama final validation

on:
  push:
    branches: [art/fujiyama-joe-style-batches]
    paths: [.github/workflows/fujiyama-final-validation.yml]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7.1
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          echo "c7ff14fd28472c8d4f193043de30278dcf7e5241a1dcf7566b02e27addaa33ba  /tmp/godot.zip" | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Run repository-portable Python tests
        shell: bash
        run: |
          python3 - <<'PY'
          import unittest

          discovered = unittest.defaultTestLoader.discover("tools/tests", pattern="test_*.py")
          portable = unittest.TestSuite()

          def collect(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      collect(item)
                  elif item.__class__.__module__ != "test_cutout_rig":
                      portable.addTest(item)

          collect(discovered)
          result = unittest.TextTestRunner(verbosity=1).run(portable)
          if not result.wasSuccessful():
              raise SystemExit(1)
          PY

      - name: Import project headlessly
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Run Fujiyama runtime regression
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tools/tests/test_fujiyama_runtime_visuals.gd
