name: Validate Okamura scaffold

on:
  push:
    branches:
      - art/okamura-production-sprites
    paths:
      - 'tools/init_okamura_art_package.py'
      - 'tools/process_okamura_art.py'
      - 'tools/tests/test_okamura_art_tools.py'
      - '.github/workflows/validate_okamura_scaffold.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile helpers
        run: |
          python3 -m py_compile tools/init_okamura_art_package.py
          python3 -m py_compile tools/process_okamura_art.py
          python3 -m py_compile tools/tests/test_okamura_art_tools.py
      - name: Run Okamura helper tests
        run: python3 tools/tests/test_okamura_art_tools.py
