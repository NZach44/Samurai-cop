name: Okamura preproduction validation

on:
  push:
    branches:
      - art/okamura-production-sprites
    paths:
      - '.github/workflows/okamura-preproduction-validation.yml'
      - 'tools/init_okamura_art_package.py'
      - 'tools/process_okamura_art.py'
      - 'tools/validate_okamura_production.py'
      - 'tools/tests/test_okamura_art_tools.py'
      - 'tools/tests/test_okamura_runtime_visuals.gd'
      - 'data/fighters/okamura.tres'
      - 'data/moves/okamura_special_1.tres'
      - 'data/moves/okamura_special_2.tres'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Run Okamura art-tool tests
        run: python3 -m unittest tools.tests.test_okamura_art_tools

      - name: Install Godot 4.7.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.1-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --version

      - name: Import project
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --editor --quit

      - name: Run Okamura runtime regression
        run: /tmp/godot/Godot_v4.7.1-stable_linux.x86_64 --headless --path . --script tools/tests/test_okamura_runtime_visuals.gd
